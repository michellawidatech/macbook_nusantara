name: CI

on:
  push:
    # Every branch, not only main: the work happens on feature branches, and
    # until 2026-09-18 a push there was checked by nothing at all.
    branches: ["**"]
    # The only way into prod. Pushing a v* tag builds the release and deploys
    # it to the shop's Mac mini (docs/deploy-pipeline.md); cutting a tag is the
    # deliberate act a required-reviewer gate would otherwise be.
    tags: ["v*"]
  # "Run workflow" on a v* tag redeploys that tag — the pipeline's rollback. It
  # reuses the tarball already attached to the tag's GitHub Release.
  #
  # "Run workflow" on a BRANCH deploys that branch to staging
  # (https://staging-pos.macbooknusantara.com, docs/staging.md) — the way to
  # try a feature on the shop's own data before it is merged. A push to main
  # deploys main there by itself.
  #
  # No pull_request trigger: every push is already checked, and a pull request
  # shows the checks of its head commit. Both at once ran every job twice
  # against the plan's 2,000 free minutes.
  workflow_dispatch:
    inputs:
      refresh_staging_data:
        description: >-
          Staging only: replace staging's database with a fresh copy of the
          shop's before migrating it. Everything done on staging since the
          last copy is lost.
        type: boolean
        default: false

# A second push to the same branch makes the first one's answer worthless.
# main and the release tags are excluded: those runs are the record of what
# cleared stage and prod, and a cancelled one is a gap in it. So is a "Run
# workflow": it is a deploy somebody asked for, and its group is its own, so a
# push to the same branch can never cancel it halfway through a migration.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  static:
    name: Format, lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Each gate runs even when an earlier one failed: one push should report
      # every problem it introduced, not just the first.
      - name: Format (prettier --check)
        run: pnpm format

      - name: Lint (eslint)
        if: ${{ !cancelled() }}
        run: pnpm lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: pnpm typecheck

      - name: Build
        if: ${{ !cancelled() }}
        run: pnpm build

  test:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Not a mock. 01 §7 and 08 §2: the invariants under test are CHECK
    # constraints, column-level grants and real concurrency, and none of those
    # exist in a fake. 16 matches the developer cluster.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          # The role tests (packages/db/test/invariants.test.ts,
          # agentRole.test.ts) log in as nusantara, nusantara_app and
          # nusantara_agent with NO password, because the developer cluster
          # trusts localhost. The image's default, scram-sha-256, refused
          # every one of them — the failure CI reported from 2026-08-19. A
          # container that lives and dies with this job loses nothing by
          # trusting its own loopback.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The DSN the suites fall back to is a local trust-auth socket, so CI has
      # to name its own. Not a secret: it reaches a throwaway container that
      # lives and dies with this job. turbo.json lists both under the test
      # task's passThroughEnv — turbo's strict env mode hands a task nothing
      # undeclared, and without that every suite silently used its fallback.
      TEST_DATABASE_URL: postgresql://nusantara:nusantara@localhost:5432/nusantara_pos_test
      DATABASE_URL: postgresql://nusantara:nusantara@localhost:5432/nusantara_pos_test

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # `nusantara` owns the schema but is deliberately not a superuser and
      # cannot mint roles — that separation is what makes 08 §9 mean anything,
      # so CI reproduces it rather than running everything as postgres.
      - name: Create the owner role and the test database
        run: |
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nusantara') THEN
              CREATE ROLE nusantara LOGIN PASSWORD 'nusantara';
            END IF;
          END
          $$;
          SQL
          psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE "nusantara_pos_test" OWNER nusantara'

      # roles.sql is not a migration by design: the grants migration aborts with
      # "missing database role(s)" unless these three already exist.
      - name: Create the application roles (roles.sql, as superuser)
        run: psql "$SUPERUSER_URL" -v ON_ERROR_STOP=1 -f packages/db/prisma/roles.sql

      - name: Apply migrations
        run: pnpm --filter @nusantara/db exec prisma migrate deploy

      # `prisma migrate status` lies in this project: a recorded-but-unapplied
      # migration reports clean while the table is missing. The only honest
      # check is a real query, so ask the database what it actually has.
      - name: Verify the schema is really there
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            missing text;
          BEGIN
            SELECT string_agg(t, ', ')
              INTO missing
              FROM unnest(ARRAY['Unit', 'UnitEvent', 'Outbox', 'IdempotencyKey']) AS t
             WHERE to_regclass(format('public.%I', t)) IS NULL;

            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'migrations reported success but these tables are missing: %', missing;
            END IF;
          END
          $$;
          SQL

      # `pnpm test` is `turbo run test --concurrency=1`, and the serialisation is
      # load-bearing: apps/api truncates the whole public schema of this same
      # database between cases, so a parallel suite would lose its fixtures
      # mid-test and fail as a phantom concurrency bug.
      - name: Test
        run: pnpm test

  # The sealed release for the Mac mini (deploy/macmini/build-release.mjs), built
  # here and never on the Mac mini itself: that release exists so the shop's
  # machine holds compiled output and no source, and a runner that checked the
  # repo out there would undo it. An Apple silicon runner also produces the
  # darwin-arm64 Prisma engine and argon2 binary the Mac mini loads.
  release:
    name: Build the release (Apple silicon)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static, test]
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write # create the tag's GitHub Release and attach the build
    outputs:
      version: ${{ steps.name.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      # The tag names the release; the commit makes a moved tag visible. A
      # redeploy of an old tag finds its tarball already attached and reuses
      # those exact bytes — a rebuild would be a different release under the
      # same name, and the Mac mini refuses that (ops/nusantara-deploy).
      - name: Name the release
        id: name
        run: |
          version="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null |
            grep -qx "nusantara-$version.tar.gz"; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "::notice::nusantara-$version is already on the $GITHUB_REF_NAME release — reusing it"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup
        if: steps.name.outputs.built != 'true'

      - name: Build
        if: steps.name.outputs.built != 'true'
        env:
          NUSANTARA_VERSION: ${{ steps.name.outputs.version }}
        run: node deploy/macmini/build-release.mjs

      # The tarball is what ships. The source maps never go to the shop, but a
      # crash report from it is unreadable without them, so they live here —
      # private, like the repository.
      - name: Attach it to the GitHub Release
        if: steps.name.outputs.built != 'true'
        env:
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          cd build/macmini
          shasum -a 256 "nusantara-$VERSION.tar.gz" > "nusantara-$VERSION.tar.gz.sha256"
          tar -czf "nusantara-$VERSION-sourcemaps.tar.gz" -C maps "$VERSION"
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "nusantara-$VERSION.tar.gz" \
            "nusantara-$VERSION.tar.gz.sha256" \
            "nusantara-$VERSION-sourcemaps.tar.gz"

  # Delivered over Tailscale: the job joins the tailnet as an ephemeral tag:ci
  # node, and the tailnet policy lets that tag reach the Mac mini's SSH port and
  # nothing else. The deploy key there has a forced command, so all the job can
  # do on the machine is ask ops/nusantara-deploy for one of its four verbs.
  #
  # The `prod` environment admits only v* tags, and holds every credential this
  # job uses — no branch can reach any of them.
  deploy:
    name: Deploy to the Mac mini
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    # One deploy at a time, and never cancelled halfway: a migration cut off
    # mid-run is worse than a deploy that waited.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read # the release assets
      id-token: write # Tailscale workload identity federation
    env:
      VERSION: ${{ needs.release.outputs.version }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'nusantara-deploy' }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the prod environment is configured
        env:
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_OWNER_URL: ${{ secrets.PROD_OWNER_DATABASE_URL != '' }}
          HAS_TS_CLIENT: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_TS_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
          TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=("variable DEPLOY_HOST")
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing+=("variable DEPLOY_KNOWN_HOSTS")
          [ "$HAS_SSH_KEY" = true ] || missing+=("secret DEPLOY_SSH_KEY")
          [ "$HAS_OWNER_URL" = true ] || missing+=("secret PROD_OWNER_DATABASE_URL")
          [ "$HAS_TS_CLIENT" = true ] || missing+=("secret TS_OAUTH_CLIENT_ID")
          [ -n "$TS_AUDIENCE" ] || [ "$HAS_TS_SECRET" = true ] ||
            missing+=("variable TS_AUDIENCE (or secret TS_OAUTH_SECRET)")
          if [ ${#missing[@]} -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::the prod environment has no $m (docs/deploy-pipeline.md)"; done
            exit 1
          fi

      # The migrations and the Prisma CLI come from the tag's own checkout, so
      # the schema that is applied is exactly the one the release was built on.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Download the release
        run: |
          gh release download "$GITHUB_REF_NAME" --dir release \
            --pattern "nusantara-$VERSION.tar.gz" --pattern "nusantara-$VERSION.tar.gz.sha256"
          (cd release && sha256sum -c "nusantara-$VERSION.tar.gz.sha256")

      # Preferred: workload identity federation — GitHub's own OIDC token is
      # exchanged for a Tailscale one, and no Tailscale secret is stored here.
      - name: Join the tailnet (workload identity)
        if: vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Join the tailnet (OAuth client)
        if: vars.TS_AUDIENCE == ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      # The host key is pinned from a variable, never learned on first contact:
      # a runner that trusted whatever answered would hand the tarball and the
      # owner's password to it.
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host mini
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF

      - name: What is live now
        run: |
          ssh mini status | tee status.txt
          have=$(sed -n 's/^installer=//p' status.txt)
          want=$(sed -n 's/^INSTALLER_VERSION=//p' deploy/macmini/ops/nusantara-deploy)
          if [ "$have" != "$want" ]; then
            echo "::warning::the Mac mini runs nusantara-deploy $have, the repo has $want — re-run setup-deploy-access there (docs/deploy-pipeline.md)"
          fi

      - name: Back up the database
        run: ssh mini backup "predeploy-$VERSION" | tee backup.txt

      # Migrations before code, as the owner, through the same tunnel the
      # runbook uses by hand (docs/deploy-macmini.md §3). The deploy key may
      # forward exactly this one port.
      - name: Migrate
        env:
          OWNER_URL: ${{ secrets.PROD_OWNER_DATABASE_URL }}
        run: |
          case "$OWNER_URL" in
            *@127.0.0.1:55432/nusantara_pos_prod*) ;;
            *) echo "::error::PROD_OWNER_DATABASE_URL must point at the tunnel: postgresql://nusantara:…@127.0.0.1:55432/nusantara_pos_prod"; exit 1 ;;
          esac
          ssh -f -N -M -S "$RUNNER_TEMP/tunnel" -o ExitOnForwardFailure=yes \
            -L 55432:127.0.0.1:5432 mini
          DATABASE_URL="$OWNER_URL" pnpm --filter @nusantara/db exec prisma migrate deploy | tee migrate.txt

      # `prisma migrate status` lies in this project, so the database is asked
      # directly: every migration this tag carries is applied and finished,
      # none is left half-done, and the API's role still holds exactly the
      # privileges that make the ledger append-only. Anything else stops the
      # deploy here, before the new code is switched on.
      - name: Verify the schema (ask the database, not Prisma)
        env:
          OWNER_URL: ${{ secrets.PROD_OWNER_DATABASE_URL }}
        run: |
          q() { psql "$OWNER_URL" -v ON_ERROR_STOP=1 -tAc "$1"; }
          ls packages/db/prisma/migrations | grep '^[0-9]' | sort > expected.txt
          q "select migration_name from _prisma_migrations where finished_at is not null and rolled_back_at is null order by 1" | sort > applied.txt
          missing=$(comm -23 expected.txt applied.txt)
          if [ -n "$missing" ]; then echo "::error::not applied: $missing"; exit 1; fi
          extra=$(comm -13 expected.txt applied.txt)
          if [ -n "$extra" ]; then echo "::notice::the database is ahead of this tag (a rollback?): $extra"; fi
          failed=$(q "select count(*) from _prisma_migrations where finished_at is null and rolled_back_at is null")
          if [ "$failed" != 0 ]; then echo "::error::$failed migration(s) started and never finished"; exit 1; fi
          grants=$(q "select has_table_privilege('nusantara_app','\"Unit\"','SELECT'), has_table_privilege('nusantara_app','\"Unit\"','DELETE'), has_table_privilege('nusantara_app','\"UnitEvent\"','INSERT'), has_table_privilege('nusantara_app','\"UnitEvent\"','UPDATE'), has_table_privilege('nusantara_app','\"UnitNotePhoto\"','DELETE')")
          if [ "$grants" != "t|f|t|f|t" ]; then echo "::error::nusantara_app's grants are $grants, not t|f|t|f|t — the ledger is not append-only"; exit 1; fi
          echo "$(wc -l < applied.txt | tr -d ' ') migrations applied, grants t|f|t|f|t"

      - name: Close the tunnel
        if: always()
        run: ssh -S "$RUNNER_TEMP/tunnel" -O exit mini 2> /dev/null || true

      # The installer on the Mac mini checks the hash and the tarball's shape,
      # unpacks, switches `current`, restarts, and waits for the API to answer
      # as this exact version — and switches back by itself if it does not.
      - name: Install on the Mac mini
        run: |
          # pipefail: the installer's refusal must fail this step. Without it
          # the step reported `tee`'s exit code, so a release the installer
          # rolled back (2026-10-22: the worker would not stay up) showed green.
          set -o pipefail
          sha=$(cut -d' ' -f1 "release/nusantara-$VERSION.tar.gz.sha256")
          ssh mini install "$VERSION" "$sha" < "release/nusantara-$VERSION.tar.gz" | tee install.txt
          # Belt and braces: the installer's own last word must be that THIS
          # release is live.
          grep -F "nusantara-$VERSION is live" install.txt

      # Optional: the same answer from outside, through `tailscale serve`. Needs
      # the tailnet policy to let tag:ci reach port 443 as well as 22.
      - name: Check from the tailnet
        if: vars.DEPLOY_PUBLIC_URL != ''
        env:
          URL: ${{ vars.DEPLOY_PUBLIC_URL }}
        run: curl -fsS --max-time 20 "$URL/api/health" | grep -F "\"release\":\"$VERSION\""

      - name: Summary
        if: always()
        run: |
          {
            echo "### \`nusantara-$VERSION\` → Mac mini"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Was live | \`$(sed -n 's/^current=//p' status.txt 2> /dev/null)\` |"
            echo "| Backup | $(sed -n 's/^backup ok: //p' backup.txt 2> /dev/null) |"
            echo
            echo '```'
            cat install.txt 2> /dev/null || echo "(not installed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Staging — docs/staging.md. The same sealed release and the same installer
  # as the two jobs above, aimed at /opt/nusantara-stage on the same Mac mini.
  # ⚠️ These two mirror `release` and `deploy` step for step; a change to one
  # pair is almost always owed to the other.
  # ---------------------------------------------------------------------------

  # Needs `static` and NOT `test`: the build is what staging cannot do without,
  # and the suites take a quarter of an hour that a person waiting to try a
  # branch should not have to spend. They still run beside it and still report.
  stage-release:
    name: Build the staging release (Apple silicon)
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/'))
    needs: [static]
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The branch, the commit and the run. The run is in it because a rebuild
      # of the same commit is different bytes, and the installer refuses a
      # second set of bytes under a name it already holds.
      - name: Name the release
        id: name
        run: |
          branch=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-40)
          echo "version=stage-$branch-${GITHUB_SHA::7}-$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup

      - name: Build
        env:
          NUSANTARA_VERSION: ${{ steps.name.outputs.version }}
        run: node deploy/macmini/build-release.mjs

      - name: Checksum
        env:
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          cd build/macmini
          shasum -a 256 "nusantara-$VERSION.tar.gz" > "nusantara-$VERSION.tar.gz.sha256"

      # A run artifact, not a GitHub Release: a staging build is not a
      # release anybody will redeploy. Kept a few days for a re-run.
      - uses: actions/upload-artifact@v4
        with:
          name: stage-release
          path: |
            build/macmini/nusantara-${{ steps.name.outputs.version }}.tar.gz
            build/macmini/nusantara-${{ steps.name.outputs.version }}.tar.gz.sha256
          retention-days: 3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: stage-sourcemaps
          path: build/macmini/maps/${{ steps.name.outputs.version }}
          retention-days: 3

  # The `stage` environment holds its own SSH key — pinned on the Mac mini to
  # `nusantara-deploy --stage`, so it cannot touch the shop — its own Tailscale
  # identity, and the owner's URL for nusantara_pos_stage. It admits any
  # branch, because "Run workflow" on any branch is how a feature is tried.
  stage-deploy:
    name: Deploy to staging
    needs: [stage-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: stage
      url: https://staging-pos.macbooknusantara.com
    concurrency:
      group: deploy-stage
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Tailscale workload identity federation
    env:
      VERSION: ${{ needs.stage-release.outputs.version }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'nusantara-deploy' }}
      REFRESH: ${{ inputs.refresh_staging_data == true }}
    steps:
      - name: Check the stage environment is configured
        env:
          HAS_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_OWNER_URL: ${{ secrets.STAGE_OWNER_DATABASE_URL != '' }}
          HAS_TS_CLIENT: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAS_TS_SECRET: ${{ secrets.TS_OAUTH_SECRET != '' }}
          TS_AUDIENCE: ${{ vars.TS_AUDIENCE }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=()
          [ -n "$DEPLOY_HOST" ] || missing+=("variable DEPLOY_HOST")
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing+=("variable DEPLOY_KNOWN_HOSTS")
          [ "$HAS_SSH_KEY" = true ] || missing+=("secret DEPLOY_SSH_KEY")
          [ "$HAS_OWNER_URL" = true ] || missing+=("secret STAGE_OWNER_DATABASE_URL")
          [ "$HAS_TS_CLIENT" = true ] || missing+=("secret TS_OAUTH_CLIENT_ID")
          [ -n "$TS_AUDIENCE" ] || [ "$HAS_TS_SECRET" = true ] ||
            missing+=("variable TS_AUDIENCE (or secret TS_OAUTH_SECRET)")
          if [ ${#missing[@]} -gt 0 ]; then
            for m in "${missing[@]}"; do echo "::error::the stage environment has no $m (docs/staging.md)"; done
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v4
        with:
          name: stage-release
          path: release

      - name: Check the release
        run: (cd release && sha256sum -c "nusantara-$VERSION.tar.gz.sha256")

      - name: Join the tailnet (workload identity)
        if: vars.TS_AUDIENCE != ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Join the tailnet (OAuth client)
        if: vars.TS_AUDIENCE == ''
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ vars.DEPLOY_HOST }}

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host mini
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 15
            ServerAliveCountMax 8
          EOF

      # Staging's key arrives at the installer as `--stage status`. An
      # installer from before staging (INSTALLER_VERSION 1) answers that with
      # its usage line — and this is where that shows.
      - name: What is live on staging now
        run: |
          if ! ssh mini status | tee status.txt; then
            echo "::error::the Mac mini refused the staging key's status — re-run setup-deploy-access --stage there (docs/staging.md §3)"
            exit 1
          fi
          if [ "$(sed -n 's/^target=//p' status.txt)" != stage ]; then
            echo "::error::this key reached the installer for '$(sed -n 's/^target=//p' status.txt)', not stage — it must be pinned with setup-deploy-access --stage"
            exit 1
          fi

      # Before the migrations, so a copy of the shop's older schema is brought
      # up to this branch's in the same run.
      - name: Copy the shop's database into staging
        if: env.REFRESH == 'true'
        run: ssh mini refresh | tee refresh.txt

      - name: Migrate
        env:
          OWNER_URL: ${{ secrets.STAGE_OWNER_DATABASE_URL }}
        run: |
          case "$OWNER_URL" in
            *@127.0.0.1:55432/nusantara_pos_stage*) ;;
            *) echo "::error::STAGE_OWNER_DATABASE_URL must point at the tunnel: postgresql://nusantara:…@127.0.0.1:55432/nusantara_pos_stage"; exit 1 ;;
          esac
          ssh -f -N -M -S "$RUNNER_TEMP/tunnel" -o ExitOnForwardFailure=yes \
            -L 55432:127.0.0.1:5432 mini
          DATABASE_URL="$OWNER_URL" pnpm --filter @nusantara/db exec prisma migrate deploy | tee migrate.txt

      - name: Verify the schema (ask the database, not Prisma)
        env:
          OWNER_URL: ${{ secrets.STAGE_OWNER_DATABASE_URL }}
        run: |
          q() { psql "$OWNER_URL" -v ON_ERROR_STOP=1 -tAc "$1"; }
          ls packages/db/prisma/migrations | grep '^[0-9]' | sort > expected.txt
          q "select migration_name from _prisma_migrations where finished_at is not null and rolled_back_at is null order by 1" | sort > applied.txt
          missing=$(comm -23 expected.txt applied.txt)
          if [ -n "$missing" ]; then echo "::error::not applied: $missing"; exit 1; fi
          extra=$(comm -13 expected.txt applied.txt)
          if [ -n "$extra" ]; then echo "::warning::staging's database has migrations this branch does not: $extra — run again with 'refresh staging data' ticked for a clean copy"; fi
          failed=$(q "select count(*) from _prisma_migrations where finished_at is null and rolled_back_at is null")
          if [ "$failed" != 0 ]; then echo "::error::$failed migration(s) started and never finished"; exit 1; fi
          grants=$(q "select has_table_privilege('nusantara_app','\"Unit\"','SELECT'), has_table_privilege('nusantara_app','\"Unit\"','DELETE'), has_table_privilege('nusantara_app','\"UnitEvent\"','INSERT'), has_table_privilege('nusantara_app','\"UnitEvent\"','UPDATE'), has_table_privilege('nusantara_app','\"UnitNotePhoto\"','DELETE')")
          if [ "$grants" != "t|f|t|f|t" ]; then echo "::error::nusantara_app's grants are $grants, not t|f|t|f|t — the ledger is not append-only"; exit 1; fi
          echo "$(wc -l < applied.txt | tr -d ' ') migrations applied, grants t|f|t|f|t"

      - name: Close the tunnel
        if: always()
        run: ssh -S "$RUNNER_TEMP/tunnel" -O exit mini 2> /dev/null || true

      - name: Install on staging
        run: |
          sha=$(cut -d' ' -f1 "release/nusantara-$VERSION.tar.gz.sha256")
          ssh mini install "$VERSION" "$sha" < "release/nusantara-$VERSION.tar.gz" | tee install.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### \`nusantara-$VERSION\` → staging"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Was live | \`$(sed -n 's/^current=//p' status.txt 2> /dev/null)\` |"
            echo "| Data | $(sed -n 's/^✓ //p' refresh.txt 2> /dev/null || true) |"
            echo "| Address | https://staging-pos.macbooknusantara.com |"
            echo
            echo '```'
            cat install.txt 2> /dev/null || echo "(not installed)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
