# Render Blueprint — the API, the worker and the webhook, plus PostgreSQL.
# docs/deploy.md is the runbook; this is the declaration it describes.
#
# The SPA is not here. It is on Netlify, which proxies `/api` and `/auth` to the
# API service so the session cookie stays same-origin — netlify.toml says why.
#
# ## Singapore, not Oregon
#
# The shop is in Indonesia and `oregon` is Render's default. Jakarta to Oregon
# is a ~200 ms round trip; to Singapore it is ~30 ms. The measured latency of a
# page in this app is 7–8 ms of PostgreSQL, so on the default region the
# network would be twenty-five times the query — every serial lookup at the
# counter, with a customer standing there. The database is in the same region
# for the same reason: the API talks to it far more often than a browser talks
# to the API.

databases:
  - name: nusantara-pos
    region: singapore
    # `resolveDatabaseUrl` reads the database NAME to decide which environment
    # this is (packages/db/src/environment.ts). Render lets the blueprint name
    # it, so the guard's own vocabulary is used rather than a generated one.
    databaseName: nusantara_pos_prod
    # The OWNER role, which is the one migrations run as. The three application
    # roles are created inside the database by
    # packages/db/prisma/bootstrap-managed.sql — they cannot be declared here,
    # and none of the services connects as this one.
    user: nusantara
    postgresMajorVersion: "16"
    # ⚠️ `free` here is a database Render DELETES after 30 days. See
    # docs/deploy.md — for this app that is the wrong default, because nothing
    # in it is ever hard-deleted and the ledger is the point.
    plan: 0.1c-256mb

services:
  # ---------------------------------------------------------------------------
  # The API. What the Netlify site proxies to.
  # ---------------------------------------------------------------------------
  - name: nusantara-api
    type: web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    repo: https://github.com/michellawidatech/macbook_nusantara
    branch: rebuild/inc1-interaction-kit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The image's own CMD. Named anyway, so the three services read alike and
    # none of them is "the one that depends on what the Dockerfile happens to
    # end with".
    dockerCommand: pnpm exec tsx apps/api/src/server.ts
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: prod
      # NOT `fromDatabase`. That property hands over the OWNER's connection
      # string, and the whole point of the three roles is that the API is not
      # the owner: `nusantara_app` may append to UnitEvent and may never update
      # or delete it, which is how "every state change is an append-only row"
      # stops being a convention. Set to nusantara_app's own DSN after
      # bootstrap-managed.sql has created it. See docs/deploy.md.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://macbook-nusantara.netlify.app
      # The NETLIFY origin, not this service's. express-openid-connect builds
      # redirect_uri from it, and the browser only ever sees Netlify — Render is
      # behind a proxy it never learns the name of. Pointing this at the Render
      # hostname sends the browser somewhere the session cookie is not.
      - key: AUTH0_BASE_URL
        value: https://macbook-nusantara.netlify.app
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_CLIENT_ID
        sync: false
      - key: AUTH0_CLIENT_SECRET
        sync: false
      # 32 bytes of randomness that never has to be transcribed by a person.
      - key: AUTH0_SECRET
        generateValue: true
      # Without it the chat agent stays switched off, and says so at startup.
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # The worker. Drafts replies and drains the outbox. Listens on nothing, so it
  # has no health check and no URL.
  # ---------------------------------------------------------------------------
  - name: nusantara-worker
    type: worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    repo: https://github.com/michellawidatech/macbook_nusantara
    branch: rebuild/inc1-interaction-kit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: pnpm exec tsx apps/worker/src/main.ts
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      # GRAPH_API_VERSION is deliberately absent. v25.0 is one constant in the
      # code for both channels, and CLAUDE.md's rule is never two env
      # fallbacks — setting it here is how the two channels start to drift.

  # ---------------------------------------------------------------------------
  # The Meta webhook receiver. Public, and fail-closed: with no APP_SECRET it
  # rejects every event rather than trusting one.
  # ---------------------------------------------------------------------------
  - name: nusantara-webhook
    type: web
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    repo: https://github.com/michellawidatech/macbook_nusantara
    branch: rebuild/inc1-interaction-kit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: pnpm exec tsx apps/whatsapp-webhook/src/server.ts
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: prod
      - key: DATABASE_URL
        sync: false
      # The two the API is forbidden to hold: apps/api/src/secretsFile.ts
      # allows itself two keys and refuses APP_SECRET on purpose. Verifying an
      # inbound Meta event is this service's job and nothing else's.
      - key: APP_SECRET
        sync: false
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: PHONE_NUMBER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_BUSINESS_ACCOUNT_ID
        sync: false
